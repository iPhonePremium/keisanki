<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三角比計算ツール</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;color:#1f2937}
.container{max-width:1000px;margin:auto;padding:24px 16px 50px}
h1{text-align:center;margin:8px 0 8px;font-size:28px}
.subtitle{text-align:center;color:#6b7280;margin-bottom:24px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 4px 18px #0000000d}
h2{font-size:20px;margin:0 0 15px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-weight:700;display:block;margin-bottom:6px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
input:focus,select:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
button{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#2563eb;color:white;font-weight:700}
button.secondary{background:#e5e7eb;color:#374151}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.diagram-wrap{display:flex;justify-content:center;overflow:auto;padding:8px}
svg{width:min(620px,100%);height:auto}
.angle-btn{cursor:pointer}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.result{border:1px solid #e5e7eb;border-radius:14px;padding:14px;background:#fafafa}
.result .name{font-size:18px;font-weight:800}
.result .value{font-size:21px;font-weight:700;margin:8px 0;word-break:break-all}
.result .decimal{color:#6b7280;font-size:14px}
.note{font-size:13px;color:#6b7280;line-height:1.6}
.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:10px;border-radius:10px;margin-top:12px;display:none}
@media(max-width:700px){.controls,.results{grid-template-columns:1fr}.container{padding:16px 10px 40px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="container">
<h1>三角比計算ツール</h1>
<div class="subtitle">角A・角Bを視覚的に設定して、sin・cos・tanを計算</div>

<div class="card">
<h2>① 角A・角Bを設定</h2>
<div class="diagram-wrap">
<svg viewBox="0 0 620 330" aria-label="三角形">
  <polygon id="tri" points="100,270 520,270 100,70" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
  <circle id="aPoint" class="angle-btn" cx="100" cy="270" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle id="bPoint" class="angle-btn" cx="520" cy="270" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="292" font-size="24" font-weight="700">A</text>
  <text x="520" y="292" font-size="24" font-weight="700">B</text>
  <text x="315" y="305" font-size="18">底辺 c</text>
  <text x="62" y="170" font-size="18" transform="rotate(-90 62 170)">高さ b</text>
  <text x="310" y="145" font-size="18" transform="rotate(-25 310 145)">斜辺 a</text>
  <text id="angleAText" x="128" y="252" font-size="18" font-weight="700">A = 25°</text>
  <text id="angleBText" x="395" y="252" font-size="18" font-weight="700">B = 65°</text>
</svg>
</div>
<div class="controls">
  <div><label for="angleA">角A（度）</label><input id="angleA" type="number" min="0.000001" max="179.999999" step="any" value="25"></div>
  <div><label for="angleB">角B（度）</label><input id="angleB" type="number" min="0.000001" max="179.999999" step="any" value="65"></div>
</div>
<div class="note" style="margin-top:10px">※ 三角形の角A・角Bは、A＋B＜180°になるように設定してください。図のA・Bをタップしても入力欄に移動できます。</div>
</div>

<div class="card">
<h2>② 分かっている辺を入力</h2>
<div class="controls">
  <div>
    <label for="knownSide">分かっている辺</label>
    <select id="knownSide">
      <option value="a">斜辺 a（A・Bの対辺）</option>
      <option value="b">辺 b（Aの対辺）</option>
      <option value="c">辺 c（A・Bの間の辺）</option>
    </select>
  </div>
  <div>
    <label for="knownValue">長さ</label>
    <input id="knownValue" type="text" value="1" placeholder="例：5、3/4、√3、2√5">
  </div>
</div>
<div class="buttons">
  <button id="calc">計算する</button>
  <button class="secondary" id="reset">リセット</button>
</div>
<div id="error" class="error"></div>
</div>

<div class="card">
<h2>③ 計算結果</h2>
<div id="results" class="results"></div>
<div class="note" style="margin-top:14px">
入力は整数・小数・分数・√（ルート）に対応しています。例：<b>5</b>、<b>0.5</b>、<b>3/4</b>、<b>√3</b>、<b>2√5</b>、<b>(√3)/2</b>。
結果は、可能な場合は分数・ルートを含む形で表示し、あわせて小数も表示します。
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const A=$("angleA"),B=$("angleB"), aText=$("angleAText"),bText=$("angleBText"),error=$("error"),results=$("results");

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){let t=a%b;a=b;b=t}return a}
function frac(n,d=1){if(!Number.isFinite(n)||!Number.isFinite(d)||d===0)return null;if(d<0){n=-n;d=-d}let g=gcd(Math.round(Math.abs(n)),Math.round(Math.abs(d)));return [n/g,d/g]}
function fmtNum(x){return Number(x.toFixed(10)).toString()}

function parseExpr(s){
 s=s.trim().replaceAll(" ","").replaceAll("√","sqrt").replace(/×/g,"*");
 if(!s)return NaN;
 // safe parser for numbers, + - * / parentheses and sqrt
 if(!/^[0-9.+\-*/()sqrt]+$/.test(s)) return NaN;
 let pos=0;
 function expr(){let v=term();while(pos<s.length&&(s[pos]=="+"||s[pos]=="-")){let op=s[pos++],w=term();v=op=="+"?v+w:v-w}return v}
 function term(){let v=factor();while(pos<s.length&&(s[pos]=="*"||s[pos]=="/")){let op=s[pos++],w=factor();if(op=="/"&&w===0)throw Error();v=op=="*"?v*w:v/w}return v}
 function factor(){
   if(s.slice(pos,pos+4)=="sqrt"){pos+=4;let v=factor();if(v<0)throw Error();return Math.sqrt(v)}
   if(s[pos]=="("){pos++;let v=expr();if(s[pos]!==")")throw Error();pos++;return v}
   let m=s.slice(pos).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(!m)throw Error();pos+=m[0].length;return Number(m[0])
 }
 try{let v=expr();if(pos!==s.length||!Number.isFinite(v))return NaN;return v}catch{return NaN}
}

function prettyExact(x){
 if(Math.abs(x)<1e-12)return "0";
 // Recognize simple rational and sqrt forms
 const signs=x<0?-1:1, ax=Math.abs(x);
 for(let d=1;d<=48;d++){
   let n=Math.round(ax*d);
   if(Math.abs(ax-n/d)<1e-10){
     let f=frac(signs*n,d);
     if(f[1]===1)return String(f[0]);
     return f[0]+"/"+f[1];
   }
 }
 // Try sqrt(n)/d and n*sqrt(k)/d for small k
 for(let k=2;k<=30;k++){
   let root=Math.sqrt(k);
   for(let d=1;d<=48;d++){
     let n=Math.round(ax*d/root);
     if(Math.abs(ax-n*root/d)<1e-10){
       let f=frac(signs*n,d);
       if(f[1]===1)return (f[0]===1?"":f[0]===-1?"-":f[0])+"√"+k;
       let num=f[0]===1?"":f[0]===-1?"-":f[0];
       return num+"√"+k+"/"+f[1];
     }
   }
 }
 return fmtNum(x);
}

function updateDiagram(){
 let av=Number(A.value)||25,bv=Number(B.value)||65;
 aText.textContent=`A = ${fmtNum(av)}°`;bText.textContent=`B = ${fmtNum(bv)}°`;
 // schematic labels only; triangle remains visual reference
}

function showError(msg){error.textContent=msg;error.style.display=msg?"block":"none"}

function calc(){
 showError("");
 const av=Number(A.value),bv=Number(B.value);
 if(!(av>0&&bv>0&&av+bv<180)){showError("角Aと角Bは0°より大きく、A＋Bが180°未満になるようにしてください。");return}
 const known=$("knownSide").value, x=parseExpr($("knownValue").value);
 if(!(x>0)){showError("辺の長さは、0より大きい数・分数・ルートなどで入力してください。");return}
 const ar=av*Math.PI/180,br=bv*Math.PI/180, cr=(180-av-bv)*Math.PI/180;
 let sides={};
 // a opposite A, b opposite B, c opposite C
 if(known==="a"){sides.a=x;sides.b=x*Math.sin(br)/Math.sin(ar);sides.c=x*Math.sin(cr)/Math.sin(ar)}
 if(known==="b"){sides.b=x;sides.a=x*Math.sin(ar)/Math.sin(br);sides.c=x*Math.sin(cr)/Math.sin(br)}
 if(known==="c"){sides.c=x;sides.a=x*Math.sin(ar)/Math.sin(cr);sides.b=x*Math.sin(br)/Math.sin(cr)}
 const vals=[
 ["sin A",Math.sin(ar)],["cos A",Math.cos(ar)],["tan A",Math.tan(ar)],
 ["sin B",Math.sin(br)],["cos B",Math.cos(br)],["tan B",Math.tan(br)]
 ];
 results.innerHTML=vals.map(([n,v])=>`<div class="result"><div class="name">${n}</div><div class="value">${prettyExact(v)}</div><div class="decimal">小数：${fmtNum(v)}</div></div>`).join("");
 results.innerHTML+=`<div class="result"><div class="name">辺 a</div><div class="value">${prettyExact(sides.a)}</div><div class="decimal">小数：${fmtNum(sides.a)}</div></div>
 <div class="result"><div class="name">辺 b</div><div class="value">${prettyExact(sides.b)}</div><div class="decimal">小数：${fmtNum(sides.b)}</div></div>
 <div class="result"><div class="name">辺 c</div><div class="value">${prettyExact(sides.c)}</div><div class="decimal">小数：${fmtNum(sides.c)}</div></div>`;
}

A.addEventListener("input",updateDiagram);B.addEventListener("input",updateDiagram);
$("calc").addEventListener("click",calc);
$("reset").addEventListener("click",()=>{A.value=25;B.value=65;$("knownSide").value="a";$("knownValue").value="1";updateDiagram();calc()});
$("aPoint").addEventListener("click",()=>A.focus());
$("bPoint").addEventListener("click",()=>B.focus());
updateDiagram();calc();
</script>
</body>
</html>
